// ChunkBlazer — RuneLite Plugin Hub build file.
//
// This is the standalone Gradle build used for a Plugin Hub submission. It is
// additive: it coexists with the existing pom.xml and the in-tree dev workflow
// (run-chunkblazer.bat / sync-to-runelite.bat), which are unaffected. The Hub
// only ever reads this build.gradle. See SUBMISSION.md for the remaining steps.
//
// TODO before submitting (see SUBMISSION.md):
//   1. [DONE 2026-08-10] Package renamed net.runelite.client.plugins.chunkblazer
//      -> com.chunkblazer (sources, resources, tests, descriptor, dev bats).
//   2. [DONE 2026-08-10] `plugins=` in runelite-plugin.properties points at the
//      new FQN com.chunkblazer.ChunkBlazerPlugin.
//   3. Run `gradle wrapper` once so gradlew + gradle-wrapper.jar are committed
//      (needs a local Gradle install; not doable in the review sandbox).

plugins {
	id 'java'
	id 'checkstyle'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	// RuneLite client is provided at runtime by the host; it also brings
	// OkHttp + Gson transitively, so ChunkBlazer ships ZERO new dependencies.
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testImplementation 'org.mockito:mockito-core:5.11.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'com.chunkblazer'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

test {
	useJUnitPlatform()
}

// Vendored copy of RuneLite's own ruleset (config/checkstyle/, pulled from
// runelite/runelite @ master). The Plugin Hub CI holds submissions to these
// rules, so run them locally FIRST:  ./gradlew checkstyleMain
// config_loc resolves to configDirectory (config/checkstyle) so the
// ${config_loc}/suppressions.xml reference in checkstyle.xml is satisfied.
checkstyle {
	toolVersion = '10.12.7'
	configFile = file('config/checkstyle/checkstyle.xml')
	configDirectory = file('config/checkstyle')
	// Surface every violation rather than stopping at the first handful.
	maxErrors = 0
	maxWarnings = 0
}

// The dev workflow deliberately skips linting for fast iteration; this build's
// checkstyle is the pre-submission gate, so let it report the full list instead
// of failing the run on the first file. Flip to false once the list is clean.
tasks.withType(Checkstyle).configureEach {
	ignoreFailures = true
	reports {
		xml.required = true
		html.required = true
	}
}
