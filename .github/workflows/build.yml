name: build

# Runs the same gate as local (compile + checkstyle + tests) on every PR into
# main and on pushes to main. The "build" check this job publishes is what the
# main branch-protection rule requires before a PR can merge.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile, checkstyle, test
        run: ./gradlew --no-daemon compileJava checkstyleMain test
