# Longer text for ChunkBlazer, read as UTF-8 by com.chunkblazer.Strings.
# Keys are grouped by area. %s placeholders are filled by Strings.t(key, args);
# log templates keep SLF4J {} placeholders. Leading spaces need a backslash
# ("\ "), and newlines are written as \n.

