# --- panel: ChunkBlazerPanel ---
panel.overlayHint=Click a task to track it, right-click to star it, click a heading to fold it.
panel.historyTip=Every task you've completed, newest first, on chunkblazer.com
panel.showKeyTip=Reveal your account sync key to move this account to another computer
panel.resetTip=Wipe this account's local ChunkBlazer data and restore it fresh from the server. Your server progress is not touched.
panel.verifyBody=Type this code in public chat and hit Enter to verify your ChunkBlazer account:
panel.siteTip=Track your account progress at chunkblazer.com
panel.noSyncKey=No sync key yet. Turn on Server Sync and log in once, and your key is created automatically.
panel.revealConfirm=This will reveal your account's Sync Key on screen. Anyone who can see your screen, including a stream or screen share, will be able to read it. Are you sure you want to show it?
panel.keyBackupHtml=<html><body style='width:260px'>Select the key below and copy it (Ctrl+C), then save it somewhere safe like a password manager. To sync this account on another computer, paste it into the "Sync recovery key" setting there.<br><br><b>Anyone with this key can access your account. Do not share it.</b></body></html>
panel.resetConfirmHtml=<html><body style='width:270px'>This clears this account's ChunkBlazer data on THIS computer (mode, tasks, points, chunks, and the stored sync key) and restores it fresh from the server the next time you log in. Your server progress is not touched.<br><br>Use this only if this account is showing the wrong mode or another account's progress. After it finishes, restart RuneLite and log back in.<br><br>Continue?</body></html>
panel.resetDone=Local data cleared. Restart RuneLite and log back in to restore this account from the server. If sync does not come back on its own, paste this account's key into the "Sync recovery key" setting.
panel.syncBody=Turn on sync to save your progress across devices, show on the leaderboard, see other players, and play Competitive mode. Nothing is sent until you enable it. Your current progress will sync with the server when you do.
panel.competitiveReq=Competitive mode requires a new Ironman, Hardcore Ironman, or Ultimate Ironman account with combat level 9 or lower and no skill above level 3.
panel.syncChoiceHint=Your starting tasks are dealt once you choose Enable Sync or Play offline.
panel.enableTip=Sync your progress to chunkblazer.com
panel.offlineTip=Keep progress on this computer only. You can enable sync later.
panel.dataUse=ChunkBlazer is a server-backed game mode. To save your progress\nand rank you on the leaderboards, the plugin sends data to\nChunkBlazer's servers.\n\nWHAT IS SENT (only while "Enable Server Sync" is on):\n  • Your RuneScape name\n  • Your IP address\n  • Your current world and map region\n  • Progress events: NPC kills, XP/skill changes, items\n    obtained or equipped, and task completions\n  • If you're a Hardcore Ironman and lose that status: where\n    it happened and what killed you (shown on chunkblazer.com)\n\nWHAT IT IS USED FOR:\n  • Saving your unlocked chunks, tasks, points and game mode\n  • Server-side verification of completions (anti-cheat)\n  • Leaderboards and seeing other ChunkBlazer players online\n\nWHERE IT GOES:\n  • Over HTTPS to api.chunkblazer.com. Not shared with any\n    third parties.\n\nTrack your account progress at chunkblazer.com.
panel.dataUseTitle=How ChunkBlazer uses your data
panel.verifyFirstHtml=<html><table width='190' cellpadding='0' cellspacing='0'><tr><td>Verify your account, then choose your game mode. Type the code from the verify banner in public chat first.</td></tr></table></html>
panel.permanentHtml=<html><i>This choice is permanent for this account!</i></html>
panel.casualTip=Start anywhere. Play on any account. Featured on the casual leaderboard.
panel.casualHtml=<html><table width='190' cellpadding='0' cellspacing='0'><tr><td>Start anywhere. Play on any account. Featured on the casual leaderboard.</td></tr></table></html>
panel.competitiveTip=Featured on the main page of the leaderboard and website. You must start on a new Ironman, Hardcore Ironman or Ultimate Ironman account (combat level 9 or lower).
panel.competitiveHtml=<html><table width='190' cellpadding='0' cellspacing='0'><tr><td>Featured on the main page of the leaderboard and website. You must start on a new Ironman, Hardcore Ironman or Ultimate Ironman account (combat level 9 or lower).</td></tr></table></html>
panel.loggedOutHtml=<html>Log into Old School RuneScape to start playing ChunkBlazer.</html>
panel.confirmMode=Are you sure you want to select %s mode?\n\nThis choice is PERMANENT for this account!
panel.competitiveNeedsSync=Competitive mode needs a connection to the ChunkBlazer server to verify\nyour RuneScape account.\n\nDo you want to enable Server Sync?

