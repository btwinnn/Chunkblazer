noKey=No sync key yet. Turn on Server Sync and log in once, and your key is created automatically.
reveal=This will reveal your account's Sync Key on screen. Anyone who can see your screen, including a stream or screen share, will be able to read it. Are you sure you want to show it?
keyHelp=<html><body style='width:260px'>Select the key below and copy it (Ctrl+C), then save it somewhere safe like a password manager. To sync this account on another computer, paste it into the "Sync recovery key" setting there.<br><br><b>Anyone with this key can access your account. Do not share it.</b></body></html>
resetConfirm=<html><body style='width:270px'>This clears this account's ChunkBlazer data on THIS computer (mode, tasks, points, chunks, and the stored sync key) and restores it fresh from the server the next time you log in. Your server progress is not touched.<br><br>Use this only if this account is showing the wrong mode or another account's progress. After it finishes, restart RuneLite and log back in.<br><br>Continue?</body></html>
resetDone=Local data cleared. Restart RuneLite and log back in to restore this account from the server. If sync does not come back on its own, paste this account's key into the "Sync recovery key" setting.
syncBody=Turn on sync to save your progress across devices, show on the leaderboard, see other players, and play Competitive mode. Nothing is sent until you enable it. Your current progress will sync with the server when you do.
compReq=Competitive mode requires a new Ironman, Hardcore Ironman, or Ultimate Ironman account with combat level 9 or lower and no skill above level 3.
syncHint=Your starting tasks are dealt once you choose Enable Sync or Play offline.
offlineTip=Keep progress on this computer only. You can enable sync later.
dataUse=ChunkBlazer is a server-backed game mode. To save your progress\n\
and rank you on the leaderboards, the plugin sends data to\n\
ChunkBlazer's servers.\n\
\n\
WHAT IS SENT (only while "Enable Server Sync" is on):\n\
\  • Your RuneScape name\n\
\  • Your IP address\n\
\  • Your current world and map region\n\
\  • Progress events: NPC kills, XP/skill changes, items\n\
\    obtained or equipped, and task completions\n\
\  • If you're a Hardcore Ironman and lose that status: where\n\
\    it happened and what killed you (shown on chunkblazer.com)\n\
\n\
WHAT IT IS USED FOR:\n\
\  • Saving your unlocked chunks, tasks, points and game mode\n\
\  • Server-side verification of completions (anti-cheat)\n\
\  • Leaderboards and seeing other ChunkBlazer players online\n\
\n\
WHERE IT GOES:\n\
\  • Over HTTPS to api.chunkblazer.com. Not shared with any\n\
\    third parties.\n\
\n\
Track your account progress at chunkblazer.com.
